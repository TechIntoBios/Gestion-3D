<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Productos y Categorías</title>
    <link rel="icon" href="Iconos/logo.svg">
    <link rel="stylesheet" href="Css/estilos.css">
</head>

<body class="pagina-products">
    <header>
        <div>
            <div class="contenedor-logo">
                <img src="Iconos/logo.svg" class="logo" alt="Logo">
            </div>
            <b>ZUNOX 3D</b>
        </div>
        <div class="menu-opciones">
            <button type="button" id="btn-menu" class="salida" aria-label="Abrir menú" aria-haspopup="true" aria-expanded="false" aria-controls="panel-menu">
                <span>
                    <img src="Iconos/puntos.svg" alt="">
                </span>
            </button>
            <nav id="panel-menu" class="panel-menu" aria-label="Menú" hidden>
                <a href="admin.html" class="item-menu">
                    <img src="Iconos/plus-pequeno.svg" alt="">
                    Nuevo pedido
                </a>
                <a href="tracking-admin.html" class="item-menu">
                    <img src="Iconos/calendario-reloj.svg" alt="">
                    Seguimiento de pedidos
                </a>
                <hr>
                <button type="button" id="btn-cerrar-sesion" class="item-menu item-cerrar-sesion">
                    <img src="Iconos/salida.svg" alt="">
                    Cerrar sesión
                </button>
            </nav>
        </div>
    </header>

    <main>
        <section id="section-1">
            <p class="p-1">CATÁLOGO</p>
            <h1 class="p-2">Productos y categorías</h1>
            <p id="lbl-errores" class="mensaje-busqueda" role="status" aria-live="polite"></p>
        </section>

        <section id="section-cargar-producto">
            <div class="contenedor-datos">
                <div class="encabezado-tarjeta">
                    <h4>Cargar producto</h4>
                    <button type="button" id="btn-editar-productos" class="btn-editar" aria-label="Editar productos" title="Editar productos">
                        <img src="Iconos/editar.svg" alt="">
                    </button>
                </div>
                <p id="lbl-resumen-productos" class="resumen-catalogo"></p>
                <form id="form-productos">
                    <label for="ddl-categorias">Categoría</label>
                    <select id="ddl-categorias" name="categoria" required>
                        <option disabled selected value="">Selecciona una categoría</option>
                    </select>

                    <label for="nombreProducto">Nombre del producto</label>
                    <input type="text" id="nombreProducto" name="nombreProducto" placeholder="Vaso 3D" maxlength="100" required>

                    <label for="precio">Precio</label>
                    <input type="number" id="precio" name="precio" placeholder="0,00" min="0.01" step="0.01" required>

                    <p id="lbl-mensaje-productos" class="mensaje-busqueda" role="status" aria-live="polite"></p>

                    <button type="submit" class="btn-submit">Cargar producto</button>
                </form>
            </div>
        </section>

        <section id="section-crear-categoria">
            <div class="contenedor-datos">
                <div class="encabezado-tarjeta">
                    <h4>Crear categoría</h4>
                    <button type="button" id="btn-editar-categorias" class="btn-editar" aria-label="Editar categorías" title="Editar categorías">
                        <img src="Iconos/editar.svg" alt="">
                    </button>
                </div>
                <p id="lbl-resumen-categorias" class="resumen-catalogo"></p>
                <form id="form-categorias">
                    <label for="nombreCategoria">Nombre de categoría</label>
                    <input type="text" id="nombreCategoria" name="nombreCategoria" placeholder="Ej.: Accesorios" maxlength="100" required>

                    <p id="lbl-mensaje-categorias" class="mensaje-busqueda" role="status" aria-live="polite"></p>

                    <button type="submit" class="btn-submit">Cargar categoría</button>
                </form>
            </div>
        </section>

        <dialog id="dlg-edicion" class="panel-edicion" aria-labelledby="ttl-edicion">
            <form method="dialog">
                <button type="submit" class="btn-cerrar-panel" aria-label="Cerrar">
                    <img src="Iconos/Cancelar.svg" alt="">
                </button>
            </form>

            <h2 id="ttl-edicion" class="ttl-edicion">Editar</h2>
            <p class="ayuda-edicion">Los pedidos ya cargados no cambian: guardan el nombre y el precio de cuando se hicieron.</p>

            <form id="form-edicion">
                <label for="ddl-edicion-item" id="lbl-edicion-item">Elegí qué editar</label>
                <select id="ddl-edicion-item" required></select>

                <label for="txt-edicion-nombre">Nombre</label>
                <input type="text" id="txt-edicion-nombre" maxlength="100" required>

                <div id="campos-edicion-producto">
                    <label for="ddl-edicion-categoria">Categoría</label>
                    <select id="ddl-edicion-categoria"></select>

                    <label for="txt-edicion-precio">Precio</label>
                    <input type="number" id="txt-edicion-precio" min="0.01" step="0.01" placeholder="0,00">
                </div>

                <label class="interruptor">
                    <input type="checkbox" id="chk-edicion-activo" role="switch">
                    <span class="interruptor-pista" aria-hidden="true"></span>
                    <span class="interruptor-texto" id="lbl-edicion-activo">Activo</span>
                </label>

                <p id="lbl-edicion" class="mensaje-busqueda" role="status" aria-live="polite"></p>

                <div class="acciones-edicion">
                    <button type="button" id="btn-cancelar-edicion" class="btn-cancelar">Cancelar</button>
                    <button type="submit" id="btn-guardar-edicion" class="btn-guardar-cambios">
                        <img src="Iconos/Check.svg" alt="">
                        Guardar
                    </button>
                </div>
            </form>
        </dialog>
    </main>
    <script src="JavaScript/menu.js" type="module"></script>
    <script src="JavaScript/products.js" type="module"></script>
</body>

</html>
