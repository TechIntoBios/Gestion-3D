<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Registro</title>
    <link rel="icon" href="Iconos/logo.svg">
    <link href="Css/admin.css" rel="stylesheet">
</head>

<body>
    <header>
        <div>
            <div class="contenedor-logo">
                <img src="Iconos/logo.svg" class="logo">
            </div>
            <b>ZUNOX 3D</b>
        </div>
        <div>
            <div class="salida">
                <span>
                    <img src="Iconos/menu-hamburguesa.svg" alt="Opciones">
                </span>
            </div>
        </div>
    </header>

    <main>
        <form>
            <section id="section-1">
                <p class="p-1">
                    NUEVO PEDIDO
                </p>
                <p class="p-2">
                    Nuevo Registro
                </p>
                <p class="p-3">
                    Ingresá los datos y los prodcutos del pedido.
                </p>
            </section>
            <section id="section-2">
                <div class="contenedor-datos">
                    <h4>Datos de contacto</h4>
                    <div class="sub-contenedor-datos">
                        <div>
                            <p>
                                Nombre
                            </p>
                            <input type="text" name="nombre" placeholder="Ingresá el nombre" maxlength="100" pattern="[^0-9]+" title="El nombre no puede contener números" required>
                        </div>
                        <div class="apellido">
                            <p>
                                Apellido
                            </p>
                            <input type="text" name="apellido" placeholder="Ingresá el apellido" maxlength="100" pattern="[^0-9]+" title="El apellido no puede contener números" required>
                        </div>
                    </div>
                    <p>Mail (opcional)</p>
                    <input type="email" name="correo" placeholder="ejemplo@correo.com" maxlength="300">
                    <p>Teléfono</p>
                    <input type="tel" name="telefono" placeholder="1123456789" minlength="10" maxlength="20" pattern="[0-9]{10,20}" title="Ingresá entre 10 y 20 dígitos, sin espacios ni guiones" required>
                    <p>Zona</p>
                    <input type="text" name="zona" placeholder="Ingresá la zona" maxlength="100" required>
                </div>
            </section>
            <section id="section-3">
                <div class="contenedor-prodcuctos">
                    <h4>Productos</h4>
                    <div class="contenedor-nota">
                        <p>Notas de pedido</p>
                        <textarea placeholder="Agregá una nota para el pedido"></textarea>
                    </div>
                    <div class="sub-contendor-productos">
                        <p>Categoría</p>
                        <select required>
                            <option value="" disabled selected>Seleccioná una categoría</option>
                        </select>
                        <p>Producto</p>
                        <select required>
                            <option value="" disabled selected>Seleccioná un producto</option>
                        </select>
                        <div class="contenedor-precios">
                            <div>
                                <p>Cantidad</p>
                                <input type="number" placeholder="1" min="1" step="1" required>
                            </div>
                            <div>
                                <p>Precio unitario</p>
                                <input type="number" placeholder="0,00" min="0.01" step="0.01" required>
                            </div>
                            <div>
                                <span>
                                    <img src="Iconos/basura.svg">
                                </span>
                            </div>
                        </div>
                        <div>
                            <p>Subtotal</p>
                            <label>$</label>
                        </div>
                    </div>
                </div>
                <div class="contenedor-total">
                    <div class="fila-total">
                        <p>Total</p>
                        <label>$</label>
                    </div>
                    <button type="button" class="btn-agregar">+ Agregar producto</button>
                </div>
            </section>
            <section id="section-guardar">
                <button type="submit" class="btn-guardar">
                    <img src="Iconos/Check.svg" alt="">
                    Guardar
                </button>
            </section>
        </form>
    </main>

    <footer>

    </footer>
</body>

</html>
